[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dictophone"
version = "0.1.1"
description = "VoxVault — бесплатное офлайн-распознавание речи (приватность, без облака)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["speech-recognition", "stt", "vosk", "offline", "transcription", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Natural Language :: Russian",
    "Natural Language :: Ukrainian",
    "Natural Language :: German",
    "Natural Language :: French",
    "Natural Language :: Spanish",
    "Natural Language :: Italian",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
    "requests>=2.31",
]

[project.optional-dependencies]
# GUI нужен не всем: CLI работает и без Qt, поэтому PySide6 — extra, а не
# обязательная зависимость. В сборку exe ставится через `pip install .[gui]`.
gui = ["PySide6-Essentials>=6.5"]
dev = ["pytest>=7.4", "pyinstaller>=6.6"]

[project.scripts]
dictophone = "dictophone.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
