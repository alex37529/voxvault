name: CI

# Сборка exe занимает несколько минут, поэтому в обычных пушах проверяем
# тесты и быстрые инварианты упаковки, а полную сборку — раз в неделю
# и при ручном запуске.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  # Те же проверки, что и pre-commit локально: кто-то не ставит pre-commit,
  # а в репозиторий попадать должно только вычищенное.
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy bandit types-PyYAML types-requests
      - name: ruff (lint + формат)
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: mypy
        run: python -m mypy
      - name: bandit
        run: python -m bandit -c pyproject.toml -r src -lll

  # Локально проверки запускает pre-commit (см. scripts/setup-dev.ps1).
  # Этот job гоняет ровно те же хуки — с теми же версиями из rev, — поэтому
  # «локально зелёное, в CI красное» невозможно: если сломается конфиг
  # pre-commit или версия хука, узнаем тут, а не у разработчика.
  pre-commit:
    # windows-latest, а не ubuntu: проект Windows-only (VOSK, PortAudio,
    # ctypes.windll), и на Linux-заглушках mypy видит другой код.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit
      - name: Конфигурация хуков корректна
        run: python -m pre_commit validate-config .pre-commit-config.yaml
      - name: Прогнать все хуки
        run: python -m pre_commit run --all-files --show-diff-on-failure

  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"
      - name: Тесты
        run: python -m pytest

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"
      - name: Собрать
        # Собираем ровно то, что уходит в релиз (onefile, один exe),
        # иначе CI проверял бы другой артефакт, а ломалась бы публикация.
        run: python packaging\build.py --clean --onefile --zip
      - name: Диагностика сборки
        run: |
          $p = Start-Process -FilePath dist\VoxVault.exe `
            -ArgumentList "--selftest" -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput selftest.txt -RedirectStandardError selftest-err.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) {
            Get-Content selftest-err.txt
            throw "selftest не прошёл: код $($p.ExitCode)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: VoxVault-win64
          path: dist/VoxVault-*.zip
          if-no-files-found: error
