name: CI

# Сборка exe занимает несколько минут, поэтому в обычных пушах проверяем
# тесты и быстрые инварианты упаковки, а полную сборку — раз в неделю
# и при ручном запуске.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"
      - name: Тесты
        run: python -m pytest

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"
      - name: Собрать
        # Собираем ровно то, что уходит в релиз (onefile, один exe),
        # иначе CI проверял бы другой артефакт, а ломалась бы публикация.
        run: python packaging\build.py --clean --onefile --zip
      - name: Диагностика сборки
        run: |
          $p = Start-Process -FilePath dist\VoxVault.exe `
            -ArgumentList "--selftest" -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput selftest.txt -RedirectStandardError selftest-err.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) {
            Get-Content selftest-err.txt
            throw "selftest не прошёл: код $($p.ExitCode)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: VoxVault-win64
          path: dist/VoxVault-*.zip
          if-no-files-found: error
