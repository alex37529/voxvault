name: Release

# Релиз собирается по тегу вида v0.1.0. Артефакт: dist/VoxVault-<version>-win64.zip
# (модели в него не попадают — качаются приложением при первом запуске).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12: PyInstaller догоняет свежие версии Python с задержкой,
          # на неподдержанной собирается bootloader, который не запустится.
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"

      - name: Тесты
        run: python -m pytest

      - name: Собрать
        # --onefile: в архив релиза попадает ровно один VoxVault.exe, без
        # папки _internal с тысячей файлов. Плата — распаковка во временный
        # каталог при каждом запуске (старт ~2 с вместо ~1 с).
        run: python packaging\build.py --clean --onefile --zip

      - name: Проверить состав архива
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            # @() обязателен: когда в архиве один файл, .FullName отдаёт
            # строку, а не массив, и $names[0] вернул бы первый символ ('V')
            # вместо имени файла — проверка падала бы ложно.
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
          } finally {
            $archive.Dispose()
          }
          $names | ForEach-Object { Write-Host "  в архиве: $_" }
          if ($names.Count -ne 1) { throw "в архиве $($names.Count) файлов, ожидался один" }
          if ($names[0] -ne "VoxVault.exe") { throw "ожидался VoxVault.exe, а в архиве $($names[0])" }

      - name: Отчёт о размере
        run: |
          Get-ChildItem dist\*.zip | Format-Table Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}

      - name: Контрольная сумма
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          $hash = Get-FileHash $zip.FullName -Algorithm SHA256
          "$($hash.Hash)  $($zip.Name)" | Out-File dist\SHA256SUMS.txt -Encoding utf8
          Get-Content dist\SHA256SUMS.txt

      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## VoxVault

            Бесплатное офлайн-распознавание речи: запись с микрофона и
            транскрибация файлов, без облака и отправки данных в интернет.

            **Установка**
            1. Скачайте `VoxVault-<версия>-win64.zip` и распакуйте в любую
               папку — внутри всего один файл, `VoxVault.exe`.
            2. Запустите его. При первом запуске выберите язык интерфейса и
               скачайте модель распознавания (модели не входят в сборку).
            3. Папку с программой можно переносить: модели и тексты пишутся
               рядом с exe.

            **Важно:** никаких дополнительных файлов распаковывать не нужно.
            При каждом запуске программа сама распаковывает свои библиотеки
            во временный каталог Windows, поэтому старт занимает на ~1 секунду
            дольше. Если Windows покажет предупреждение «SmartScreen» — это
            ожидаемо для неподписанной сборки, выберите «Подробнее» → «Выполнить
            в любом случае».

            **Требования:** Windows 10/11 x64, ~500 МБ свободного места
            (включая место под модель). Python не нужен.

            Сумма SHA256 — в файле `SHA256SUMS.txt`.
